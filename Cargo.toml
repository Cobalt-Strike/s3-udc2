[package]
name = "s3-udc2"
version = "1.0.0"
edition = "2024"
license = "MIT"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

[[bin]]
name = "s3-udc2-relay"
path = "src/main.rs"

[[bin]]
name = "s3-udc2-presign"
path = "src/presign.rs"

[dependencies]
udc2-relay = { git = "https://github.com/henkru/udc2-relay.git", rev = "923bab2942acbed5650fbcb96edcce5cbb7c8679" }
tokio = { version = "1.48.0" }
futures = "0.3.31"
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive", "env"] }
aws-config = { version = "1.8.10", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.116.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "http-1x", "sigv4a"] }
aws-sdk-sqs = { version = "1.90.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
bytes = "1.10.1"
rand = "0.9.2"
base64 = "0.22.1"
hex = "0.4.3"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
chrono = "0.4.42"
hmac = "0.12.1"
sha2 = "0.10.9"
toml = "0.9.8"
hyper = "1.8.1"
hyper-util = "0.1.19"
http-body-util = "0.1.3"
hyper-rustls = "0.27.7"
uuid = { version = "1.19.0", features = ["v4"] }
